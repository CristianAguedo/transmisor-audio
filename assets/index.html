<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Monitor de Audio</title>
<style>
  :root {
    --bg: #070b18;
    --card: rgba(23, 32, 58, 0.72);
    --line: rgba(148, 163, 184, 0.16);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-dark: #1d4ed8;
    --live: #10b981;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    background: radial-gradient(1200px 700px at 15% -10%, #23306b 0%, transparent 55%),
                radial-gradient(900px 600px at 110% 20%, #123a52 0%, transparent 50%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 34px 26px 26px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 26px 60px rgba(0, 0, 0, 0.55);
    text-align: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    background: rgba(148, 163, 184, 0.12);
    color: var(--muted);
    transition: background 0.25s, color 0.25s;
  }
  .badge.on { background: rgba(16, 185, 129, 0.16); color: var(--live); }
  .badge.off { background: rgba(239, 68, 68, 0.14); color: var(--danger); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .badge.on .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.45); opacity: 0.45; } }
  h1 { font-size: 1.45rem; font-weight: 700; margin: 16px 0 6px; }
  .subtitle { color: var(--muted); font-size: 0.92rem; }
  .source {
    margin: 18px 0 4px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(15, 23, 42, 0.45);
    font-size: 0.86rem;
    color: var(--muted);
    word-break: break-word;
  }
  .source strong { color: var(--text); font-weight: 600; }

  /* Audio Spectrum Visualizer Card */
  .visualizer-wrap {
    margin: 18px 0 6px;
    padding: 12px 14px 10px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(11, 16, 32, 0.6);
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.35);
  }
  .visualizer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.70rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .viz-live-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #64748b;
    margin-right: 5px;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .viz-live-dot.active {
    background: var(--live);
    box-shadow: 0 0 8px var(--live);
  }
  #spectrum {
    width: 100%;
    height: 64px;
    display: block;
    border-radius: 8px;
  }

  .btn {
    margin-top: 18px;
    width: 100%;
    border: none;
    cursor: pointer;
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 17px 24px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    box-shadow: 0 12px 26px -8px rgba(37, 99, 235, 0.75);
    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 16px 30px -8px rgba(37, 99, 235, 0.85); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.playing { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 12px 26px -8px rgba(185, 28, 28, 0.7); }
  .row {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  input[type=range] { flex: 1; accent-color: var(--accent); height: 26px; }
  .icon-btn {
    background: rgba(148, 163, 184, 0.14);
    border: none;
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1.1rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { background: rgba(148, 163, 184, 0.26); }
  .hint { margin-top: 18px; font-size: 0.78rem; color: var(--muted); min-height: 1.1em; }
  .hint.error { color: var(--danger); }
  .stats {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-around;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .stats b { display: block; color: var(--text); font-size: 0.95rem; font-weight: 600; margin-top: 3px; }
</style>
</head>
<body>
<div class="card">
  <div class="badge" id="badge"><span class="dot"></span><span id="badgeText">CONECTANDO</span></div>
  <h1>Monitor de Audio</h1>
  <p class="subtitle">Escuchá la fuente en tiempo real</p>

  <div class="source" id="source">Fuente: <strong id="sourceName">—</strong></div>

  <!-- Audio Spectrum Visualizer -->
  <div class="visualizer-wrap">
    <div class="visualizer-header">
      <span>ESPECTRO DE AUDIO</span>
      <span><span class="viz-live-dot" id="vizDot"></span><span id="vizLabel">EN ESPERA</span></span>
    </div>
    <canvas id="spectrum" width="360" height="64"></canvas>
  </div>

  <button class="btn" id="playBtn" disabled>
    <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <span id="btnText">Escuchar</span>
  </button>

  <div class="row">
    <button class="icon-btn" id="muteBtn" title="Silenciar">🔊</button>
    <input type="range" id="vol" min="0" max="1" step="0.02" value="1">
  </div>

  <p class="hint" id="hint"></p>

  <div class="stats">
    <div>Estado<b id="statState">—</b></div>
    <div>Conexión<b id="statConn">—</b></div>
    <div>Transmisión<b id="statBitrate">—</b></div>
  </div>

  <audio id="audio" preload="none" playsinline></audio>
</div>

<script>
const audio = document.getElementById("audio");
audio.crossOrigin = "anonymous";

const playBtn = document.getElementById("playBtn");
const btnText = document.getElementById("btnText");
const playIcon = document.getElementById("playIcon");
const muteBtn = document.getElementById("muteBtn");
const vol = document.getElementById("vol");
const hint = document.getElementById("hint");
const badge = document.getElementById("badge");
const badgeText = document.getElementById("badgeText");
const sourceName = document.getElementById("sourceName");
const statState = document.getElementById("statState");
const statConn = document.getElementById("statConn");
const statBitrate = document.getElementById("statBitrate");

const canvas = document.getElementById("spectrum");
const ctx = canvas.getContext("2d");
const vizDot = document.getElementById("vizDot");
const vizLabel = document.getElementById("vizLabel");

const ICON_PLAY = "M8 5v14l11-7z";
const ICON_PAUSE = "M6 5h4v14H6zm8 0h4v14h-4z";
let playing = false;
let muted = false;
let serverDown = false;

// ----------------- Web Audio API Spectrum Setup -----------------
let audioCtx = null;
let analyser = null;
let sourceNode = null;
let dataArray = null;
let webAudioReady = false;

function initWebAudio() {
  if (webAudioReady) {
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    return;
  }
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    audioCtx = new AudioContextClass();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64; // 32 frequency bins
    analyser.smoothingTimeConstant = 0.82;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    sourceNode = audioCtx.createMediaElementSource(audio);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    webAudioReady = true;
  } catch (err) {
    console.warn("Web Audio API falló o no soportado en streaming:", err);
    webAudioReady = false;
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

// Spectrum Animation Loop
const NUM_BARS = 24;
const prevHeights = new Array(NUM_BARS).fill(3);
let wavePhase = 0;

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function drawSpectrum() {
  requestAnimationFrame(drawSpectrum);

  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  ctx.clearRect(0, 0, w, h);

  if (playing && webAudioReady && analyser && dataArray) {
    analyser.getByteFrequencyData(dataArray);
  }

  const barSpacing = 3;
  const totalSpacing = (NUM_BARS - 1) * barSpacing;
  const barWidth = Math.max(2, (w - totalSpacing) / NUM_BARS);

  wavePhase += 0.05;

  for (let i = 0; i < NUM_BARS; i++) {
    let targetHeight = 3;

    if (playing) {
      if (webAudioReady && dataArray) {
        // Read frequency data (concentrated in lower 24 bins)
        const val = dataArray[i] || 0;
        targetHeight = Math.max(3, (val / 255) * (h - 8));
      } else {
        // Fallback rhythmic wave animation if MediaElementSource is restricted by browser
        const wave = Math.sin(wavePhase + i * 0.4) * 0.5 + 0.5;
        const sub = Math.cos(wavePhase * 0.8 + i * 0.25) * 0.3 + 0.3;
        targetHeight = Math.max(4, (wave * 0.65 + sub * 0.35) * (h - 10));
      }
    }

    // Smooth interpolation easing
    prevHeights[i] += (targetHeight - prevHeights[i]) * 0.25;
    const curH = prevHeights[i];
    const x = i * (barWidth + barSpacing);
    const y = h - curH;

    // Gradient styling
    const grad = ctx.createLinearGradient(0, y, 0, h);
    if (playing) {
      grad.addColorStop(0, "#38bdf8"); // Sky blue top
      grad.addColorStop(0.5, "#2563eb"); // Blue mid
      grad.addColorStop(1, "#10b981"); // Emerald bottom
    } else {
      grad.addColorStop(0, "rgba(148, 163, 184, 0.4)");
      grad.addColorStop(1, "rgba(51, 65, 85, 0.3)");
    }

    ctx.fillStyle = grad;
    ctx.beginPath();
    const r = Math.min(barWidth / 2, curH / 2, 3);
    if (ctx.roundRect) {
      ctx.roundRect(x, y, barWidth, curH, [r, r, 0, 0]);
    } else {
      ctx.rect(x, y, barWidth, curH);
    }
    ctx.fill();
  }

  // Update status dot & label
  if (playing) {
    vizDot.classList.add("active");
    vizLabel.textContent = "EN VIVO";
    vizLabel.style.color = "var(--live)";
  } else {
    vizDot.classList.remove("active");
    vizLabel.textContent = "EN ESPERA";
    vizLabel.style.color = "";
  }
}
drawSpectrum();

function setHint(text, isError) {
  hint.textContent = text || "";
  hint.classList.toggle("error", Boolean(isError));
}

function setBadge(state, text) {
  badge.classList.remove("on", "off");
  if (state) badge.classList.add(state);
  badgeText.textContent = text;
}

playBtn.addEventListener("click", async () => {
  playBtn.disabled = true;
  if (playing) {
    playing = false;
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    btnText.textContent = "Escuchar";
    playIcon.setAttribute("d", ICON_PLAY);
    playBtn.classList.remove("playing");
    setHint("");
  } else {
    initWebAudio();
    audio.src = "/stream.mp3?t=" + Date.now();
    try {
      await audio.play();
      playing = true;
      btnText.textContent = "Pausar";
      playIcon.setAttribute("d", ICON_PAUSE);
      playBtn.classList.add("playing");
      setHint("");
    } catch (err) {
      playing = false;
      btnText.textContent = "Escuchar";
      playIcon.setAttribute("d", ICON_PLAY);
      playBtn.classList.remove("playing");
      setHint("No se pudo reproducir. Tocá de nuevo o revisá el firewall.", true);
    }
  }
  playBtn.disabled = false;
});

vol.addEventListener("input", () => { audio.volume = Number(vol.value); });
muteBtn.addEventListener("click", () => {
  muted = !muted;
  audio.muted = muted;
  muteBtn.textContent = muted ? "🔇" : "🔊";
});

audio.addEventListener("waiting", () => setHint("Buffering…"));
audio.addEventListener("playing", () => setHint(""));
audio.addEventListener("error", () => {
  if (!playing) return;
  playing = false;
  playBtn.classList.remove("playing");
  btnText.textContent = "Escuchar";
  playIcon.setAttribute("d", ICON_PLAY);
  setHint("Se cortó la transmisión.", true);
});

async function poll() {
  try {
    const res = await fetch("/api/status?t=" + Date.now(), { cache: "no-store" });
    const data = await res.json();
    const on = Boolean(data.transmitting);
    setBadge(on ? "on" : "off", on ? "EN VIVO" : "SIN EMISIÓN");
    playBtn.disabled = !on;
    statState.textContent = on ? "Emitiendo" : "Detenido";
    statConn.textContent = (data.clients || 0) + (data.clients === 1 ? " oyente" : " oyentes");
    statBitrate.textContent = data.bitrate || "—";
    const detail = [data.samplerate ? data.samplerate + " Hz" : null, data.bitrate || null]
      .filter(Boolean).join(" · ");
    sourceName.textContent = (data.device || "desconocida") + (detail ? " — " + detail : "");
    if (on) {
      if (serverDown && !playing) setHint("");
      serverDown = false;
    } else {
      serverDown = true;
      if (!playing) setHint("El servidor no está emitiendo audio.", true);
    }
  } catch (err) {
    setBadge("off", "SIN CONEXIÓN");
    statState.textContent = "Sin conexión";
  }
  setTimeout(poll, 1500);
}
poll();
</script>
</body>
</html>
